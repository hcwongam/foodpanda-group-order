<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foodpanda 辦公室拼單神器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
    .bg-fp-pink { background-color: #d70f64; }
    .bg-fp-pink:hover { background-color: #b50b52; }
    .text-fp-pink { color: #d70f64; }
    .modal { transition: opacity 0.2s ease-in-out; }
    .modal-hidden { display: none !important; }
  </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">

  <!-- 頂部導覽列 -->
  <header class="bg-white shadow-sm border-b sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-fp-pink text-white w-10 h-10 rounded-xl flex items-center justify-center font-bold text-xl">
          🐼
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-gray-900 flex items-center gap-2">
            Foodpanda <span class="text-xs bg-pink-100 text-fp-pink font-semibold px-2 py-0.5 rounded-full">辦公室拼單</span>
          </h1>
          <p class="text-xs text-gray-500">團結力量大 · 運費一起省</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="notiBtn" type="button" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg font-medium transition flex items-center gap-1.5">
          <span>🔔</span>
          <span id="notiBtnText">開啟 Windows 桌面通知</span>
        </button>
        <button id="openCreateBtn" type="button" class="bg-fp-pink text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition hover:opacity-90">
          + 發起新拼單
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">

    <!-- 通知提示 -->
    <div id="notiBanner" class="hidden mb-6 p-4 rounded-xl bg-amber-50 border border-amber-200 flex items-start gap-3">
      <span class="text-amber-500">⚠️</span>
      <div class="text-sm text-amber-800">
        <p class="font-bold">提示：尚未啟用 Windows 桌面通知</p>
        <p class="text-xs text-amber-700 mt-0.5">點擊右上角的「開啟 Windows 桌面通知」，即可在有新拼單時收到 Windows 系統彈窗通知喔！</p>
      </div>
    </div>

    <!-- 狀態頁籤 -->
    <div class="flex justify-between items-center mb-6">
      <div class="flex bg-slate-200/80 p-1 rounded-xl text-sm font-medium">
        <button id="tab-active" type="button" class="px-4 py-1.5 rounded-lg bg-white shadow-sm text-gray-900 font-semibold transition">進行中揪團</button>
        <button id="tab-history" type="button" class="px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">歷史記錄</button>
      </div>
      <div class="text-sm text-gray-500" id="orderCount">目前有 0 個熱烈拼單中</div>
    </div>

    <!-- 拼單列表 -->
    <div id="orderList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <!-- 空狀態 -->
    <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300 my-4">
      <div class="w-16 h-16 bg-pink-50 text-fp-pink rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
        🍔
      </div>
      <h3 class="text-lg font-bold text-gray-800 mb-1">目前沒有進行中的拼單</h3>
      <p class="text-gray-500 text-sm mb-4">成為第一個發起人，邀請同事們一起湊免運吧！</p>
      <button id="emptyCreateBtn" type="button" class="bg-fp-pink text-white px-5 py-2.5 rounded-xl text-sm font-medium shadow transition hover:opacity-90">
        發起拼單
      </button>
    </div>

  </main>

  <!-- 發起揪團 Modal -->
  <div id="createModal" class="modal modal-hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-4 border-b">
        <h3 class="text-lg font-bold text-gray-900">🍱 發起 Foodpanda 拼單</h3>
        <button id="closeCreateBtn" type="button" class="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
      </div>

      <form id="createForm" class="space-y-4 mt-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Foodpanda 餐廳連結 *</label>
          <input type="url" id="fpUrl" required placeholder="https://www.foodpanda.hk/restaurant/..." class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-[#d70f64] focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">發起人名字 *</label>
            <input type="text" id="hostName" required placeholder="例如：Alex" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-[#d70f64] focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">部門 *</label>
            <input type="text" id="hostDept" required placeholder="例如：Marketing" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-[#d70f64] focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">電話號碼 *</label>
          <input type="tel" id="hostPhone" required placeholder="例如：91234567" pattern="[0-9]{8,11}" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-[#d70f64] focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">截單時間 *</label>
            <input type="time" id="deadline" required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-[#d70f64] focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">免運目標金額 ($) *</label>
            <input type="number" id="targetAmount" required min="1" placeholder="例如：150" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-[#d70f64] focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">配送地址 / 面交地點 *</label>
          <input type="text" id="address" required placeholder="例如：12樓 大會議室 / 茶水間" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-[#d70f64] focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">收款方式 (PayMe 或 FPS 電話) *</label>
          <input type="text" id="paymentInfo" required placeholder="PayMe 連結 / FPS 電話：91234567" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-[#d70f64] focus:outline-none">
        </div>

        <div class="border-t pt-3">
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">自己點的品項與金額 *</label>
          <div class="grid grid-cols-3 gap-2">
            <input type="text" id="hostItem" required placeholder="品項名稱" class="col-span-2 px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-[#d70f64] focus:outline-none">
            <input type="number" id="hostPrice" required min="1" placeholder="金額 ($)" class="px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-[#d70f64] focus:outline-none">
          </div>
        </div>

        <div class="pt-2 flex justify-end gap-2">
          <button id="cancelCreateBtn" type="button" class="px-4 py-2 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100">取消</button>
          <button type="submit" class="px-5 py-2 bg-fp-pink text-white rounded-xl text-sm font-medium shadow hover:opacity-90">建立拼單</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 加單 Modal -->
  <div id="joinModal" class="modal modal-hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b">
        <h3 class="text-lg font-bold text-gray-900" id="joinModalTitle">加入拼單</h3>
        <button id="closeJoinBtn" type="button" class="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
      </div>

      <form id="joinForm" class="space-y-4 mt-4">
        <input type="hidden" id="joinOrderId">
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">您的名字 *</label>
            <input type="text" id="joinName" required placeholder="例如：Ben" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-[#d70f64] focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">部門 *</label>
            <input type="text" id="joinDept" required placeholder="例如：IT" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-[#d70f64] focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">電話號碼 *</label>
          <input type="tel" id="joinPhone" required placeholder="例如：98765432" pattern="[0-9]{8,11}" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-[#d70f64] focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">點餐品項 *</label>
          <input type="text" id="joinItem" required placeholder="例如：凍奶茶 少甜" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-[#d70f64] focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">金額 ($) *</label>
          <input type="number" id="joinPrice" required min="1" placeholder="例如：24" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-[#d70f64] focus:outline-none">
        </div>

        <div class="pt-2 flex justify-end gap-2">
          <button id="cancelJoinBtn" type="button" class="px-4 py-2 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100">取消</button>
          <button type="submit" class="px-5 py-2 bg-fp-pink text-white rounded-xl text-sm font-medium shadow hover:opacity-90">確認加單</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 詳情 Modal -->
  <div id="detailModal" class="modal modal-hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-3 border-b">
        <h3 class="text-lg font-bold text-gray-900" id="detailRestaurant">餐廳詳情</h3>
        <button id="closeDetailBtn" type="button" class="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
      </div>

      <div id="detailContent" class="mt-4 space-y-4"></div>
    </div>
  </div>

  <footer class="bg-white border-t py-4 text-center text-xs text-gray-400 mt-auto">
    Foodpanda Office Order Sharing App · 專為辦公室設計的免運拼單工具
  </footer>

  <script>
    // 資料管理
    let orders = JSON.parse(localStorage.getItem('fp_orders')) || [];
    let currentTab = 'active';

    // 頁面載入完成後初始化
    document.addEventListener('DOMContentLoaded', function() {
      setupEventListeners();
      checkNotificationPermission();
      renderOrders();
      setInterval(renderOrders, 30000);
    });

    // 綁定事件監聽器
    function setupEventListeners() {
      // 頂部按鈕
      document.getElementById('notiBtn').addEventListener('click', requestNotificationPermission);
      document.getElementById('openCreateBtn').addEventListener('click', () => openModal('createModal'));
      document.getElementById('emptyCreateBtn').addEventListener('click', () => openModal('createModal'));

      // Modal 關閉按鈕
      document.getElementById('closeCreateBtn').addEventListener('click', () => closeModal('createModal'));
      document.getElementById('cancelCreateBtn').addEventListener('click', () => closeModal('createModal'));
      document.getElementById('closeJoinBtn').addEventListener('click', () => closeModal('joinModal'));
      document.getElementById('cancelJoinBtn').addEventListener('click', () => closeModal('joinModal'));
      document.getElementById('closeDetailBtn').addEventListener('click', () => closeModal('detailModal'));

      // 表單提交
      document.getElementById('createForm').addEventListener('submit', handleCreateOrder);
      document.getElementById('joinForm').addEventListener('submit', handleJoinOrder);

      // 頁籤切換
      document.getElementById('tab-active').addEventListener('click', () => switchTab('active'));
      document.getElementById('tab-history').addEventListener('click', () => switchTab('history'));
    }

    function openModal(id) {
      document.getElementById(id).classList.remove('modal-hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('modal-hidden');
    }

    function switchTab(tab) {
      currentTab = tab;
      const activeBtn = document.getElementById('tab-active');
      const historyBtn = document.getElementById('tab-history');

      if (tab === 'active') {
        activeBtn.className = 'px-4 py-1.5 rounded-lg bg-white shadow-sm text-gray-900 font-semibold transition';
        historyBtn.className = 'px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition';
      } else {
        historyBtn.className = 'px-4 py-1.5 rounded-lg bg-white shadow-sm text-gray-900 font-semibold transition';
        activeBtn.className = 'px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition';
      }
      renderOrders();
    }

    function checkNotificationPermission() {
      const btnText = document.getElementById('notiBtnText');
      const banner = document.getElementById('notiBanner');
      
      if (!("Notification" in window)) {
        btnText.innerText = "瀏覽器不支援通知";
        return;
      }

      if (Notification.permission === "granted") {
        btnText.innerText = "Windows 通知已開啟";
        banner.classList.add('hidden');
      } else if (Notification.permission === "denied") {
        btnText.innerText = "通知已被封鎖";
      } else {
        banner.classList.remove('hidden');
      }
    }

    function requestNotificationPermission() {
      if (!("Notification" in window)) {
        alert("您的瀏覽器不支援桌面通知");
        return;
      }

      Notification.requestPermission().then(permission => {
        checkNotificationPermission();
        if (permission === "granted") {
          sendWindowsNotification(" Foodpanda 拼單神器", "Windows 桌面通知已成功開啟！");
        }
      });
    }

    function sendWindowsNotification(title, body) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(title, { body: body });
      }
    }

    function saveOrders() {
      localStorage.setItem('fp_orders', JSON.stringify(orders));
    }

    function parseRestaurantName(url) {
      try {
        const parsed = new URL(url);
        const pathSegments = parsed.pathname.split('/').filter(Boolean);
        if (pathSegments.length > 0) {
          let name = pathSegments[pathSegments.length - 1]
            .replace(/restaurant\b|chain\b/g, '')
            .replace(/[-_]/g, ' ')
            .trim();
          return name ? name.toUpperCase() : "FOODPANDA 餐廳";
        }
      } catch (e) {}
      return "FOODPANDA 餐廳拼單";
    }

    function handleCreateOrder(e) {
      e.preventDefault();
      
      const fpUrl = document.getElementById('fpUrl').value;
      const hostName = document.getElementById('hostName').value;
      const hostDept = document.getElementById('hostDept').value;
      const hostPhone = document.getElementById('hostPhone').value;
      const deadline = document.getElementById('deadline').value;
      const targetAmount = parseFloat(document.getElementById('targetAmount').value);
      const address = document.getElementById('address').value;
      const paymentInfo = document.getElementById('paymentInfo').value;
      const hostItem = document.getElementById('hostItem').value;
      const hostPrice = parseFloat(document.getElementById('hostPrice').value);

      const restaurantName = parseRestaurantName(fpUrl);

      const newOrder = {
        id: Date.now().toString(),
        restaurantName,
        fpUrl,
        hostName,
        hostDept,
        hostPhone,
        deadline,
        targetAmount,
        address,
        paymentInfo,
        items: [{ userName: hostName, userDept: hostDept, userPhone: hostPhone, itemName: hostItem, price: hostPrice, isHost: true }],
        createdAt: new Date().toISOString()
      };

      orders.unshift(newOrder);
      saveOrders();
      closeModal('createModal');
      document.getElementById('createForm').reset();
      renderOrders();

      sendWindowsNotification(
        `🍱 新拼單通知：${restaurantName}`,
        `發起人：${hostName} (${hostDept})\n截單時間：${deadline} | 免運目標：$${targetAmount}`
      );
    }

    function openJoinModal(orderId) {
      const order = orders.find(o => o.id === orderId);
      if (!order) return;
      document.getElementById('joinOrderId').value = orderId;
      document.getElementById('joinModalTitle').innerText = `加入 ${order.restaurantName} 拼單`;
      openModal('joinModal');
    }

    function handleJoinOrder(e) {
      e.preventDefault();
      const orderId = document.getElementById('joinOrderId').value;
      const order = orders.find(o => o.id === orderId);
      if (!order) return;

      const userName = document.getElementById('joinName').value;
      const userDept = document.getElementById('joinDept').value;
      const userPhone = document.getElementById('joinPhone').value;
      const itemName = document.getElementById('joinItem').value;
      const price = parseFloat(document.getElementById('joinPrice').value);

      order.items.push({ userName, userDept, userPhone, itemName, price, isHost: false });

      saveOrders();
      closeModal('joinModal');
      document.getElementById('joinForm').reset();
      renderOrders();

      const total = order.items.reduce((sum, item) => sum + item.price, 0);
      const remain = Math.max(0, order.targetAmount - total);

      sendWindowsNotification(
        `加單更新：${order.restaurantName}`,
        `${userName} 加入了點餐！當前總額 $${total} ${remain === 0 ? '(已達免運！)' : `(差 $${remain})`}`
      );
    }

    function openDetailModal(orderId) {
      const order = orders.find(o => o.id === orderId);
      if (!order) return;

      document.getElementById('detailRestaurant').innerText = order.restaurantName;
      
      const currentTotal = order.items.reduce((sum, i) => sum + i.price, 0);
      const remain = Math.max(0, order.targetAmount - currentTotal);
      const progress = Math.min(100, Math.round((currentTotal / order.targetAmount) * 100));

      let itemsHtml = order.items.map(item => `
        <div class="flex justify-between items-center py-2 border-b text-sm">
          <div>
            <span class="font-bold text-gray-800">${item.userName}</span> 
            <span class="text-xs text-gray-500">(${item.userDept}${item.isHost ? ' · 發起人' : ''}) - 📞 ${item.userPhone || '無'}</span>
            <p class="text-gray-600 text-xs mt-0.5">${item.itemName}</p>
          </div>
          <div class="font-bold text-gray-800">$${item.price}</div>
        </div>
      `).join('');

      document.getElementById('detailContent').innerHTML = `
        <div class="bg-slate-50 p-3 rounded-xl border text-xs space-y-1 text-gray-600">
          <p><strong class="text-gray-800">發起人：</strong>${order.hostName} (${order.hostDept}) - 📞 ${order.hostPhone}</p>
          <p><strong class="text-gray-800">截單時間：</strong>${order.deadline}</p>
          <p><strong class="text-gray-800">配送地址：</strong>${order.address}</p>
          <p><strong class="text-gray-800">付款資訊：</strong><span class="text-fp-pink font-semibold">${order.paymentInfo}</span></p>
          <p><strong class="text-gray-800">Foodpanda 連結：</strong><a href="${order.fpUrl}" target="_blank" class="text-blue-600 underline">點此開啟菜單 ↗</a></p>
        </div>

        <div>
          <div class="flex justify-between text-xs font-bold mb-1">
            <span>免運進度 ($${currentTotal} / $${order.targetAmount})</span>
            <span>${progress}%</span>
          </div>
          <div class="w-full bg-gray-200 rounded-full h-2">
            <div class="bg-fp-pink h-2 rounded-full" style="width: ${progress}%"></div>
          </div>
          <p class="text-xs ${remain === 0 ? 'text-emerald-600' : 'text-fp-pink'} font-bold mt-1 text-right">
            ${remain === 0 ? '已符合免運條件！' : `還差 $${remain} 免運`}
          </p>
        </div>

        <div>
          <h4 class="font-bold text-sm text-gray-800 mb-2">已點品項清單 (${order.items.length} 人)</h4>
          <div class="max-h-48 overflow-y-auto pr-1">${itemsHtml}</div>
        </div>
      `;

      openModal('detailModal');
    }

    function renderOrders() {
      const listEl = document.getElementById('orderList');
      const emptyEl = document.getElementById('emptyState');
      const countEl = document.getElementById('orderCount');

      const now = new Date();
      const currentHM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      let filtered = orders.filter(o => {
        const isExpired = o.deadline < currentHM;
        return currentTab === 'active' ? !isExpired : isExpired;
      });

      countEl.innerText = `目前有 ${filtered.length} 個${currentTab === 'active' ? '進行中' : '歷史'}拼單`;

      if (filtered.length === 0) {
        listEl.innerHTML = '';
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');

      listEl.innerHTML = filtered.map(order => {
        const total = order.items.reduce((sum, i) => sum + i.price, 0);
        const remain = Math.max(0, order.targetAmount - total);
        const progress = Math.min(100, Math.round((total / order.targetAmount) * 100));
        const isExpired = order.deadline < currentHM;

        return `
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition flex flex-col overflow-hidden">
            <div class="p-5 flex-1">
              <div class="flex justify-between items-start mb-2">
                <span class="text-xs font-bold px-2.5 py-1 rounded-full ${isExpired ? 'bg-gray-100 text-gray-500' : 'bg-pink-50 text-fp-pink'}">
                  ${isExpired ? '已截單' : `截止時間 ${order.deadline}`}
                </span>
                <a href="${order.fpUrl}" target="_blank" class="text-xs text-gray-400 hover:text-fp-pink flex items-center gap-1">
                  菜單 ↗
                </a>
              </div>

              <h3 class="text-lg font-bold text-gray-900 mb-1 tracking-tight">${order.restaurantName}</h3>
              <p class="text-xs text-gray-500 mb-4 flex items-center gap-1">
                👤 ${order.hostName} (${order.hostDept}) · 📞 ${order.hostPhone}
              </p>

              <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 mb-4">
                <div class="flex justify-between text-xs font-bold text-gray-700 mb-1">
                  <span>免運目標 $${order.targetAmount}</span>
                  <span class="${remain === 0 ? 'text-emerald-600' : 'text-fp-pink'}">
                    ${remain === 0 ? '已達免運！' : `還差 $${remain}`}
                  </span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2 mb-1">
                  <div class="bg-fp-pink h-2 rounded-full transition-all duration-500" style="width: ${progress}%"></div>
                </div>
                <div class="flex justify-between text-[10px] text-gray-400">
                  <span>已湊 $${total}</span>
                  <span>${progress}%</span>
                </div>
              </div>

              <div class="text-xs text-gray-600 space-y-1 mb-2">
                <p>📍 ${order.address}</p>
                <p>💳 ${order.paymentInfo}</p>
                <p>👥 已有 ${order.items.length} 人參與拼單</p>
              </div>
            </div>

            <div class="bg-slate-50 border-t px-5 py-3 flex gap-2">
              <button onclick="openDetailModal('${order.id}')" class="flex-1 py-2 bg-white border border-slate-200 text-gray-700 text-xs font-medium rounded-xl hover:bg-slate-100 transition">
                查看明細 (${order.items.length})
              </button>
              ${!isExpired ? `
                <button onclick="openJoinModal('${order.id}')" class="flex-1 py-2 bg-fp-pink text-white text-xs font-medium rounded-xl shadow-sm hover:opacity-90 transition">
                  + 我要加單
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
